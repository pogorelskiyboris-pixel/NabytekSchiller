<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nábytek Schiller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#f6f4f0;--fg:#1d1b19;--mut:#6f6a63;--line:#dcd7cf;--acc:#8a5a34;--ph:#e9e5de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--fg:#efebe5;--mut:#a29b91;--line:#34302b;--acc:#c99466;--ph:#221f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--fg:#efebe5;--mut:#a29b91;--line:#34302b;--acc:#c99466;--ph:#221f1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;line-height:1.65;font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:15px;color:var(--fg);text-decoration:none}
.logo span{color:var(--acc)}
nav{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0;border-bottom:1px solid transparent;transition:.2s}
nav a:hover,nav a.on{color:var(--fg);border-color:var(--acc)}
.lang{display:flex;gap:4px;margin-left:8px}
.lang button{background:none;border:1px solid var(--line);color:var(--mut);font:inherit;font-size:12px;letter-spacing:.1em;padding:3px 9px;cursor:pointer}
.lang button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{max-width:1100px;margin:auto;padding:0 24px}
.view{display:none;padding:72px 0 96px}.view.on{display:block}
h1{font-weight:300;font-size:clamp(36px,6vw,68px);line-height:1.1;margin:0 0 24px;letter-spacing:-.01em;max-width:14em}
h2{font-weight:300;font-size:clamp(28px,4vw,42px);margin:0 0 32px;letter-spacing:-.01em}
h3{font-weight:500;font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px}
p{margin:0 0 16px;max-width:38em;color:var(--mut)}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.btn{display:inline-block;margin-top:16px;padding:13px 28px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font-size:14px;letter-spacing:.1em;text-transform:uppercase;transition:.2s}
.btn:hover{background:var(--fg);color:var(--bg)}
.img{background:var(--ph);background-image:repeating-linear-gradient(135deg,transparent 0 14px,var(--line) 14px 15px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-img{aspect-ratio:16/8;margin-top:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.card .img{aspect-ratio:4/3;margin-bottom:14px}
.card small{color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.card h3{margin:2px 0 0}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid var(--line)}
.svc div{padding:32px 28px 32px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.two .img{aspect-ratio:4/5}
@media(max-width:760px){.two{grid-template-columns:1fr;gap:32px}.view{padding:48px 0 64px}.bar{padding:14px 20px}nav{gap:16px}}
footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--mut);font-size:13px;letter-spacing:.1em}
.fade{animation:f .5s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#domu">Nábytek <span>Schiller</span></a>
<nav>
<a href="#domu" data-v="domu" data-i="nav_home"></a>
<a href="#portfolio" data-v="portfolio" data-i="nav_port"></a>
<a href="#sluzby" data-v="sluzby" data-i="nav_serv"></a>
<a href="#o-nas" data-v="o-nas" data-i="nav_about"></a>
<a href="#kontakt" data-v="kontakt" data-i="nav_contact"></a>
<div class="lang"><button data-l="cs">CZ</button><button data-l="en">EN</button></div>
</nav></div></header>

<main>
<section class="view" id="v-domu">
<div class="eyebrow" data-i="h_eyebrow"></div>
<h1 data-i="h_title"></h1>
<p data-i="h_text"></p>
<a class="btn" href="#portfolio" data-i="h_btn"></a>
<div class="img hero-img" data-img="hero"></div>
</section>

<section class="view" id="v-portfolio">
<h2 data-i="nav_port"></h2>
<div class="grid" id="pgrid"></div>
</section>

<section class="view" id="v-sluzby">
<h2 data-i="nav_serv"></h2>
<div class="svc" id="sgrid"></div>
</section>

<section class="view" id="v-o-nas">
<div class="two">
<div class="img" data-img="about"></div>
<div><h2 data-i="nav_about"></h2><p data-i="a_1"></p><p data-i="a_2"></p></div>
</div>
</section>

<section class="view" id="v-kontakt">
<h2 data-i="nav_contact"></h2>
<p data-i="c_soon"></p>
</section>
</main>
<footer>Nábytek Schiller</footer>
